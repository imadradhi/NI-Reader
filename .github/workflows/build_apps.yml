name: Build iOS IPA & Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual one-click build from GitHub Actions UI

jobs:
  # ==========================================
  # 1. iOS Build Job (Runs on Cloud macOS)
  # ==========================================
  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build iOS Application Binary & Bundle
        run: |
          mkdir -p build/Payload/NIReader.app
          
          # Find all Swift source files
          find ios/NIReader -name "*.swift" > swift_sources.txt
          echo "Compiling Swift source files:"
          cat swift_sources.txt
          
          # Compile with Apple swiftc directly targeting iOS arm64
          xcrun -sdk iphoneos swiftc \
            -parse-as-library \
            -target arm64-apple-ios15.0 \
            -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            -framework SwiftUI \
            -framework AVFoundation \
            -framework Vision \
            -framework CoreNFC \
            -framework UIKit \
            -framework Foundation \
            @swift_sources.txt \
            -o build/Payload/NIReader.app/NIReader

          # Set executable permissions
          chmod 755 build/Payload/NIReader.app/NIReader
          
          # Copy Info.plist and Entitlements
          cp ios/NIReader/App/Info.plist build/Payload/NIReader.app/Info.plist
          cp ios/NIReader/App/NIReader.entitlements build/Payload/NIReader.app/ || true
          echo "APPL????" > build/Payload/NIReader.app/PkgInfo

          echo "=== Verifying Payload Content ==="
          ls -la build/Payload/NIReader.app/
          
          # Package into IPA archive
          cd build
          zip -r NIReader.ipa Payload
          cd ..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIReader-iOS-IPA
          path: build/NIReader.ipa
          retention-days: 14

  # ==========================================
  # 2. Android Build Job (Runs on Ubuntu)
  # ==========================================
  build-android:
    name: Build Android App (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NIReader-Android-APK
          path: app-debug.apk
          retention-days: 14
