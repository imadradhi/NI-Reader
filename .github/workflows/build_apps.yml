name: Build iOS IPA & Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual one-click build from GitHub Actions UI

jobs:
  # ==========================================
  # 1. iOS Build Job (Runs on Cloud macOS)
  # ==========================================
  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build iOS IPA Package
        run: |
          mkdir -p build/Payload/NIReader.app
          
          # Attempt xcodebuild
          brew install xcodegen || true
          cd ios && xcodegen generate && cd .. || true

          xcodebuild build \
            -project ios/NIReader.xcodeproj \
            -scheme NIReader \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" || echo "Proceeding to bundle packaging..."

          if [ -d "build/DerivedData/Build/Products/Release-iphoneos/NIReader.app" ]; then
            echo "Copying xcodebuild output..."
            cp -r build/DerivedData/Build/Products/Release-iphoneos/NIReader.app/* build/Payload/NIReader.app/
          fi

          # Ensure binary is compiled and present
          if [ ! -f "build/Payload/NIReader.app/NIReader" ]; then
            echo "Compiling NIReader binary directly with swiftc..."
            SWIFT_FILES=$(find ios/NIReader -name "*.swift")
            xcrun -sdk iphoneos swiftc \
              -parse-as-library \
              -module-name NIReader \
              -target arm64-apple-ios15.0 \
              -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
              -framework SwiftUI \
              -framework AVFoundation \
              -framework Vision \
              -framework CoreNFC \
              -framework CoreMedia \
              -framework ImageIO \
              -framework UIKit \
              -framework Foundation \
              $SWIFT_FILES \
              -o build/Payload/NIReader.app/NIReader
          fi

          # Ensure Info.plist, Entitlements and PkgInfo exist with exact executable name
          cp ios/NIReader/App/Info.plist build/Payload/NIReader.app/Info.plist
          cp ios/NIReader/App/NIReader.entitlements build/Payload/NIReader.app/ || true
          echo "APPL????" > build/Payload/NIReader.app/PkgInfo
          chmod 755 build/Payload/NIReader.app/NIReader || true

          echo "=== Verifying Built Application Package ==="
          ls -la build/Payload/NIReader.app/
          
          # Package into IPA archive
          cd build
          zip -r NIReader.ipa Payload
          cd ..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIReader-iOS-IPA
          path: build/NIReader.ipa
          retention-days: 14

  # ==========================================
  # 2. Android Build Job (Runs on Ubuntu)
  # ==========================================
  build-android:
    name: Build Android App (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NIReader-Android-APK
          path: app-debug.apk
          retention-days: 14
