name: Build iOS IPA & Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual one-click build from GitHub Actions UI

jobs:
  # ==========================================
  # 1. iOS Build Job (Runs on Cloud macOS)
  # ==========================================
  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build iOS IPA Package
        run: |
          brew install xcodegen || true
          cd ios
          xcodegen generate
          cd ..

          xcodebuild archive \
            -project ios/NIReader.xcodeproj \
            -scheme NIReader \
            -destination "generic/platform=iOS" \
            -archivePath build/NIReader.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          mkdir -p build/Payload
          cp -r build/NIReader.xcarchive/Products/Applications/NIReader.app build/Payload/
          cp ios/NIReader/App/NIReader.entitlements build/Payload/NIReader.app/ || true

          echo "=== Verifying Payload Content ==="
          ls -la build/Payload/NIReader.app/
          
          # Package into IPA archive
          cd build
          zip -r NIReader.ipa Payload
          cd ..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIReader-iOS-IPA
          path: build/NIReader.ipa
          retention-days: 14

  # ==========================================
  # 2. Android Build Job (Runs on Ubuntu)
  # ==========================================
  build-android:
    name: Build Android App (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NIReader-Android-APK
          path: app-debug.apk
          retention-days: 14
