name: Build Android APK - Iraqi ID Reader

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Flutter APK (Android)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Java 17 ─────────────────────────────────────────────────
      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Flutter SDK ─────────────────────────────────────────────
      # NOTE: camera ^0.11 requires camera_android_camerax which needs
      # TextureRegistry.SurfaceProducer.Callback — added in Flutter 3.24.
      # Using 'stable' (latest) to always get a compatible version.
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ── 4. Print versions for logs ─────────────────────────────────
      - name: Print Flutter and Dart Versions
        run: |
          flutter --version
          dart --version

      # ── 5. Accept Android SDK Licenses ─────────────────────────────
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      # ── 6. Create local.properties ─────────────────────────────────
      #   settings.gradle asserts this file exists, so we create it here
      - name: Create local.properties for Android build
        working-directory: ./flutter_ni_reader
        run: |
          FLUTTER_SDK_PATH=$(which flutter | xargs readlink -f | xargs dirname | xargs dirname)
          echo "flutter.sdk=${FLUTTER_SDK_PATH}" > android/local.properties
          echo "sdk.dir=${ANDROID_SDK_ROOT}" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties
          echo "=== local.properties ==="
          cat android/local.properties

      # ── 7. Install Flutter packages ────────────────────────────────
      - name: Install Flutter Dependencies
        working-directory: ./flutter_ni_reader
        run: flutter pub get

      # ── 7. Dart analysis (non-fatal) ───────────────────────────────
      - name: Analyze Dart Code
        working-directory: ./flutter_ni_reader
        run: flutter analyze --no-fatal-infos || true

      # ── 8. Build APK ───────────────────────────────────────────────
      - name: Build Android APK (Release)
        working-directory: ./flutter_ni_reader
        run: |
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation
          echo "=== Build output ==="
          ls -lh build/app/outputs/flutter-apk/

      # ── 9. Stage APK with versioned name ───────────────────────────
      - name: Rename and Stage APK for Upload
        run: |
          mkdir -p release-artifacts
          BUILD_NUM=${{ github.run_number }}
          APK_NAME="Iraqi-ID-Reader-v1.0.0-build${BUILD_NUM}.apk"
          cp flutter_ni_reader/build/app/outputs/flutter-apk/app-release.apk \
             "release-artifacts/${APK_NAME}"
          echo "=== Artifact Info ==="
          ls -lh release-artifacts/
          sha256sum "release-artifacts/${APK_NAME}"

      # ── 10. Upload to GitHub Artifacts ─────────────────────────────
      - name: Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Iraqi-ID-Reader-APK-build${{ github.run_number }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

      # ── 11. Workflow Build Summary ─────────────────────────────────
      - name: Build Summary
        if: always()
        run: |
          RUN_NUM=${{ github.run_number }}
          REF_NAME=${{ github.ref_name }}
          FLUTTER_VER=$(flutter --version 2>/dev/null | head -1 | awk '{print $2}')
          {
            echo "## Iraqi ID Reader - Build Summary"
            echo ""
            echo "| Info | Value |"
            echo "|---|---|"
            echo "| App Version | v1.0.0 |"
            echo "| Build Number | ${RUN_NUM} |"
            echo "| Branch | ${REF_NAME} |"
            echo "| Package ID | com.iraq.flutter_ni_reader |"
            echo "| Flutter | ${FLUTTER_VER} stable |"
            echo "| Java | 17 Temurin |"
            echo "| Min SDK | 24 (Android 7.0 Nougat) |"
            echo "| Target SDK | 34 (Android 14) |"
            echo "| NFC Protocol | ICAO 9303 - PACE and BAC |"
            echo "| Camera | CameraX + ML Kit OCR |"
            echo ""
            echo "### App Features"
            echo "- **NFC Reading:** flutter_nfc_kit - ICAO 9303 PACE and BAC protocols"
            echo "- **OCR for MRZ:** Google ML Kit - TD1 3-line parsing + Check Digit validation"
            echo "- **Cross Verification:** MRZ vs NFC chip data cross-matching"
            echo "- **Zero-Persistence:** No biometric data stored locally on device"
            echo "- **REST API:** Send card data to desktop via USB Tethering"
            echo "- **Security:** FLAG_SECURE screen protection + SecurityZeroizer memory wipe"
            if [ -d "release-artifacts" ]; then
              APK_SIZE=$(du -sh release-artifacts/*.apk 2>/dev/null | cut -f1)
              echo ""
              echo "| APK Size | ${APK_SIZE} |"
            fi
          } >> $GITHUB_STEP_SUMMARY
