name: Build iOS IPA - Iraqi ID Reader

# iOS builds are manual only (requires macOS runner + code signing setup)
on:
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Build Flutter IPA (iOS)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter and Dart Versions
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./flutter_ni_reader
        run: flutter pub get

      - name: Install CocoaPods
        working-directory: ./flutter_ni_reader/ios
        run: |
          pod install --repo-update || pod install

      - name: Build iOS Application (Unsigned)
        working-directory: ./flutter_ni_reader
        run: |
          flutter build ios --release --no-codesign
          ls -lh build/ios/iphoneos/ || true

      - name: Package as IPA
        working-directory: ./flutter_ni_reader
        run: |
          BUILD_NUM=${{ github.run_number }}
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r "Iraqi-ID-Reader-iOS-v1.0.0-build${BUILD_NUM}.ipa" Payload

      - name: Upload IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Iraqi-ID-Reader-iOS-IPA-build${{ github.run_number }}
          path: flutter_ni_reader/build/ios/iphoneos/*.ipa
          if-no-files-found: error
          retention-days: 30
